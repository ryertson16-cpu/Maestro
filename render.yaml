# Blueprint Rails nativo (sem Docker).
# Dashboard → Blueprint maestro → Manual sync.
# Plano gratuito: migração na build (preDeployCommand só no plano pago).
databases:
  - name: maestro-db
    databaseName: maestro
    user: maestro
    plan: free

services:
  - type: web
    name: maestro
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maestro-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: MAESTRO_BILLING_ENFORCED
        value: "false"
      - key: MAESTRO_OWNER_EMAILS
        value: "ryertson7@yahoo.com.br"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
