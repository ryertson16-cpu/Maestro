# Blueprint do Render.
# Native Ruby do Render não tem Ruby 4.0.6; o Dockerfile da raiz usa a mesma versão do PC.
databases:
  - name: maestro-db
    databaseName: maestro
    user: maestro
    plan: free

services:
  - type: web
    name: maestro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maestro-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: MAESTRO_BILLING_ENFORCED
        value: "false"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
