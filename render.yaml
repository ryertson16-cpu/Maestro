# Blueprint nativo do Render (sem Docker).
# Dashboard → New → Blueprint → repositório Maestro.
databases:
  - name: maestro-db
    databaseName: maestro
    user: maestro

services:
  - type: web
    name: maestro
    runtime: ruby
    buildCommand: bundle install && bundle exec rails assets:precompile
    preDeployCommand: bundle exec rails db:prepare
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maestro-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: SOLID_QUEUE_IN_PUMA
        value: true
      - key: MAESTRO_BILLING_ENFORCED
        value: "false"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
